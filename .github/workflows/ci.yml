name: Apostille conformance
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Module reproducibility
        run: |
          for module in . apostille/zkbudget cmd/apostille; do
            GOWORK=off go -C "$module" mod tidy
          done
          git diff --exit-code -- '**/go.mod' '**/go.sum' go.mod go.sum
          test -z "$(gofmt -l apostille cmd util)"
      - run: make check
      - run: make security
      - run: make fuzz
      - name: Package without publishing
        run: npm pack ./sdk/apostille-js --pack-destination ./dist
